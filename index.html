<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلامة الصناعية | حقيبة تدريبية تفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#161b22;
  --navy:#10202c;
  --navy2:#182c3a;
  --paper:#eef0e9;
  --paper2:#e4e7dc;
  --card:#ffffff;
  --amber:#f0a202;
  --amber-deep:#c97f00;
  --steel:#3f6b8a;
  --danger:#c8341f;
  --safe:#2f7a4f;
  --line:#d8dbcd;
  --muted:#5b6570;
  --shadow: 0 10px 30px -12px rgba(16,32,44,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.8;
  overflow-x:hidden;
  font-weight:600;
}
h1,h2,h3,h4,.disp{font-family:'Cairo',sans-serif;}
p,li,td,th,span,div,a,label,input,button{font-weight:inherit;}
p,li{font-weight:600;}
table td{font-weight:600;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ---------- layout shell ---------- */
#app{display:flex;min-height:100vh;}

/* persistent slim top bar (replaces the old sidebar) */
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:linear-gradient(180deg,var(--navy),var(--navy2) 140%);
  color:#eef2f5;padding:14px 22px;position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(255,255,255,.1);
}
#topbar .brand{display:flex;align-items:center;gap:11px;text-decoration:none;}
#topbar .brand-mark{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;
  background:var(--amber);display:flex;align-items:center;justify-content:center;
}
#topbar .brand-mark svg{width:20px;height:20px;}
#topbar .brand-text .t1{font-family:'Cairo';font-weight:800;font-size:15.5px;color:#fff;letter-spacing:.2px;}
#results-topbtn{
  display:flex;align-items:center;gap:8px;color:#c9d6de;text-decoration:none;font-size:13px;font-weight:700;
  padding:8px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.15);transition:background .15s,color .15s;
}
#results-topbtn:hover{background:rgba(255,255,255,.08);color:#fff;}

/* main */
#main{flex:1;min-width:0;width:100%;}
.page{display:none;padding:0;}
.page.active{display:block;}
.wrap{max-width:920px;margin:0 auto;padding:48px 40px 90px;}

/* ---------- home ---------- */
.hero{
  background:radial-gradient(1100px 500px at 15% -10%, #1c3a4d 0%, var(--navy) 55%), var(--navy);
  color:#fff;padding:64px 40px 56px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg, rgba(240,162,2,.07) 0 14px, transparent 14px 28px);
  pointer-events:none;
}
.hero-inner{max-width:920px;margin:0 auto;position:relative;z-index:2;}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(240,162,2,.15);border:1px solid rgba(240,162,2,.4);
  color:var(--amber);padding:6px 14px;border-radius:100px;font-size:12.5px;font-weight:700;
}
.hero h1{font-size:40px;font-weight:900;line-height:1.25;margin:20px 0 14px;max-width:640px;}
.hero p{font-size:16px;color:#c3d2da;max-width:560px;margin:0 0 26px;}
.hero-stats{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap;}
.hstat b{display:block;font-family:'Cairo';font-size:26px;font-weight:800;color:var(--amber);}
.hstat span{font-size:12.5px;color:#9db2c2;}

.unit-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:-38px;position:relative;z-index:3;
  padding:0 40px;max-width:920px;margin-inline:auto;
}
.unit-card{
  background:var(--card);border-radius:16px;padding:20px 20px 18px;
  box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);
  transition:transform .15s;
}
.unit-card:hover{transform:translateY(-3px);}
.uc-top{display:flex;align-items:center;justify-content:space-between;}
.uc-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.uc-icon svg{width:22px;height:22px;}
.uc-num{font-family:'Cairo';font-weight:800;color:var(--muted);font-size:13px;}
.uc-title{font-family:'Cairo';font-weight:700;font-size:16px;line-height:1.5;}
.uc-desc{font-size:13px;color:var(--muted);}
.uc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:12px;}
.uc-badge{
  background:var(--paper2);color:var(--muted);padding:4px 10px;border-radius:100px;font-weight:700;
}
.uc-badge.done{background:#e4f1e8;color:var(--safe);}

.home-note{
  max-width:920px;margin:56px auto 0;padding:0 40px;
}
.note-box{
  background:#fff;border:1px dashed var(--line);border-radius:14px;padding:20px 22px;
  font-size:13.5px;color:var(--muted);display:flex;gap:14px;align-items:flex-start;
}
.note-box svg{width:22px;height:22px;flex:0 0 22px;margin-top:2px;color:var(--steel);}

/* ---------- unit page chrome ---------- */
.unit-head{
  background:var(--navy);color:#fff;padding:40px 40px 34px;
}
.unit-head-inner{max-width:920px;margin:0 auto;}
.uh-crumb{font-size:12.5px;color:#9db2c2;display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.uh-crumb button{background:none;border:none;color:#9db2c2;font-size:12.5px;padding:0;text-decoration:underline;}
.uh-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.uh-icon{width:56px;height:56px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;flex:0 0 56px;}
.uh-icon svg{width:30px;height:30px;color:#20140a;}
.uh-kicker{font-size:12.5px;color:var(--amber);font-weight:700;margin-bottom:4px;}
.uh-title{font-family:'Cairo';font-weight:800;font-size:26px;}
.uh-goal{
  margin-top:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:16px 18px;font-size:13.5px;color:#d6e0e6;
}
.uh-goal b{color:#fff;font-family:'Cairo';font-weight:700;display:block;margin-bottom:6px;font-size:13px;}
.uh-obj{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.obj-chip{
  background:rgba(240,162,2,.14);border:1px solid rgba(240,162,2,.35);color:var(--amber);
  font-size:12px;padding:5px 12px;border-radius:100px;
}

/* section blocks */
.sec{margin:38px 0;}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sec-dot{width:9px;height:9px;border-radius:3px;background:var(--amber);flex:0 0 9px;}
.sec h2{font-size:19px;font-weight:800;margin:0;}
.sec p{font-size:14.5px;margin:8px 0;color:#2a3138;}
.sec p.lead{color:var(--muted);font-size:14px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;}
.card h3{font-size:15.5px;margin:0 0 8px;font-weight:700;}
.card ul,.card ol{margin:8px 0 0;padding-inline-start:20px;font-size:14px;}
.card li{margin-bottom:6px;}

/* definition / callouts */
.callout{border-radius:12px;padding:14px 18px;font-size:14px;margin:14px 0;border:1px solid;}
.callout.info{background:#eef4f8;border-color:#c9dde8;color:#274a5c;}
.callout.warn{background:#fdf2e3;border-color:#f0d4a0;color:#7a4c05;}
.callout.danger{background:#fbeceA;border-color:#eec0b8;color:#7d2416;}
.callout.safe{background:#eaf5ee;border-color:#c3e1cd;color:#215a38;}
.callout b{font-family:'Cairo';display:block;margin-bottom:4px;}

/* definition-style list (formerly an icon grid — now a calm, text-forward list) */
.igrid{display:flex;flex-direction:column;gap:0;margin:18px 0;}
.iitem{
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:15px 2px;
  display:flex;gap:16px;align-items:flex-start;
}
.iitem:last-child{border-bottom:none;padding-bottom:2px;}
.iitem .ic{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:9px;padding:0!important;}
.iitem .ic svg{display:none;}
.iitem h4{margin:0 0 4px;font-size:15px;font-weight:700;font-family:'Cairo';}
.iitem p{margin:0;font-size:13.8px;color:var(--muted);line-height:1.75;}

/* slide deck (unit content, paged) */
.slide-deck{margin-top:8px;}
.slide-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.slide-dots{display:flex;gap:7px;flex-wrap:wrap;}
.slide-dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:none;padding:0;cursor:pointer;transition:.2s;}
.slide-dot:hover{background:#b9bdaa;}
.slide-dot.active{background:var(--amber);width:22px;border-radius:5px;}
.slide-counter{font-size:12px;color:var(--muted);font-family:'Cairo';font-weight:700;white-space:nowrap;}
.slide-card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:38px 40px;
  min-height:320px;box-shadow:var(--shadow);
}
.slide-card h2{font-size:21px;font-weight:800;margin:0 0 18px;padding-bottom:14px;border-bottom:2px solid #f2e9cf;}
.slide-card p{font-size:14.7px;}
.slide-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
.slide-nav .btn{display:inline-flex;align-items:center;gap:8px;}
.slide-jump{
  margin-top:26px;background:#eef4f8;border:1px solid #c9dde8;border-radius:14px;
  padding:14px 18px;font-size:13.3px;color:#274a5c;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.slide-jump a{color:var(--steel);font-weight:700;text-decoration:underline;}

/* accordion */
.acc-item{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:#fff;}
.acc-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;cursor:pointer;background:#fff;
}
.acc-h b{font-size:14.5px;font-weight:700;}
.acc-h .chev{transition:transform .2s;color:var(--muted);flex:0 0 16px;}
.acc-item.open .chev{transform:rotate(180deg);}
.acc-h .idx{
  font-family:'Cairo';font-weight:800;color:var(--amber-deep);font-size:13px;margin-inline-end:8px;
}
.acc-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.acc-item.open .acc-body{max-height:900px;}
.acc-body-in{padding:0 18px 16px;font-size:13.8px;color:#333;border-top:1px solid var(--line);padding-top:12px;}
.acc-body-in ul{margin:4px 0;padding-inline-start:18px;}
.acc-body-in li{margin-bottom:5px;}

/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap;}
.tab-btn{
  padding:8px 16px;border-radius:100px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;color:var(--muted);
}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-panels{margin-top:12px;}
.tab-panel{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px;}
.tab-panel.active{display:block;}

/* table */
.tbl-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
table th{background:var(--navy);color:#fff;text-align:right;padding:10px 14px;font-family:'Cairo';font-weight:700;font-size:12.8px;}
table td{padding:10px 14px;border-bottom:1px solid var(--line);}
table tr:last-child td{border-bottom:none;}
table tr:nth-child(even) td{background:#f8f9f4;}

/* color chips for signage */
.chip-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.chip-row:last-child{border-bottom:none;}
.chip-sw{width:30px;height:30px;border-radius:8px;flex:0 0 30px;border:1px solid rgba(0,0,0,.1);}
.chip-row b{font-size:13.5px;}
.chip-row span{display:block;font-size:12.3px;color:var(--muted);}

/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0;}
.flip-card{perspective:1200px;height:150px;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;border-radius:12px;padding:14px 16px;
  backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--line);
}
.flip-front{background:#fff;align-items:center;text-align:center;gap:8px;}
.flip-front .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.flip-front .ic svg{width:22px;height:22px;}
.flip-front b{font-size:13.5px;}
.flip-front .hint{font-size:10.8px;color:var(--muted);}
.flip-back{background:var(--navy);color:#eef2f5;transform:rotateY(180deg);font-size:12.6px;}
.flip-back b{font-family:'Cairo';color:var(--amber);display:block;margin-bottom:6px;font-size:12.8px;}

/* progress pyramid */
.pyramid{display:flex;flex-direction:column;gap:6px;margin:16px 0;}
.pyr-row{
  display:flex;align-items:center;gap:12px;color:#fff;border-radius:10px;padding:10px 16px;
  font-size:13px;font-weight:700;
}
.pyr-row small{display:block;font-weight:400;font-size:11.5px;opacity:.85;margin-top:2px;}
.pyr-row .n{font-family:'Cairo';font-weight:800;font-size:14px;}

/* checklist interactive */
.check-list{list-style:none;margin:0;padding:0;}
.check-list li{
  display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.8px;
}
.check-list li:last-child{border-bottom:none;}
.check-list input{margin-top:3px;accent-color:var(--safe);}
.check-list li.checked span{color:var(--muted);text-decoration:line-through;}

/* quiz */
.quiz-wrap{
  background:var(--navy);border-radius:20px;padding:34px 34px 38px;color:#fff;margin-top:50px;
}
.quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
.quiz-head .ic{width:40px;height:40px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;flex:0 0 40px;}
.quiz-head .ic svg{width:22px;height:22px;color:#20140a;}
.quiz-head h2{font-size:19px;margin:0;}
.quiz-sub{color:#9db2c2;font-size:13.5px;margin:8px 0 22px;}

.stu-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
.stu-field{display:flex;flex-direction:column;gap:6px;}
.stu-field label{font-size:12.5px;color:#c3d2da;}
.stu-field input{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  padding:11px 14px;color:#fff;font-size:14px;font-family:inherit;
}
.stu-field input::placeholder{color:#7f97a8;}

.q-block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.q-num{font-family:'Cairo';font-weight:800;color:var(--amber);font-size:12.5px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.q-type-tag{background:rgba(255,255,255,.08);color:#c9d6de;border-radius:20px;padding:3px 10px;font-size:10.5px;font-weight:700;}
.fill-wrap{margin-top:4px;}
.fill-input{
  width:100%;padding:12px 14px;border-radius:9px;border:1px solid #2c4a58;background:#0f1f28;color:#fff;
  font-size:14.5px;font-family:'Tajawal';font-weight:600;
}
.fill-input:focus{outline:2px solid var(--amber);}
.review-wrap{margin-top:22px;text-align:right;max-width:640px;margin-inline:auto;}
.review-title{font-family:'Cairo';font-weight:800;font-size:14px;color:#fff;margin-bottom:10px;}
.review-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;margin-bottom:6px;font-size:12.8px;}
.review-row.ok{background:rgba(70,160,110,.12);}
.review-row.bad{background:rgba(200,60,50,.12);}
.rr-icon{flex:0 0 20px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.review-row.ok .rr-icon{background:#2f7a4f;color:#fff;}
.review-row.bad .rr-icon{background:#c8341f;color:#fff;}
.rr-q{color:#dfe9ee;margin-bottom:3px;font-weight:600;}
.rr-ans{color:#a9bcc4;}
.rr-ans b{color:#8fd1a8;}
.q-text{font-size:14.5px;margin-bottom:12px;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13.6px;
}
.opt:hover{border-color:rgba(240,162,2,.5);}
.opt input{accent-color:var(--amber);}
.opt.picked{border-color:var(--amber);background:rgba(240,162,2,.12);}

.quiz-actions{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap;}
.btn{
  border:none;border-radius:11px;padding:13px 26px;font-weight:700;font-size:14px;font-family:'Cairo';
}
.btn.primary{background:var(--amber);color:#20140a;}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn.dark{background:#fff;color:var(--navy);}
.btn svg{width:15px;height:15px;vertical-align:-2px;margin-inline-end:4px;}
.uh-crumb svg{width:14px;height:14px;}
.result-name svg{width:14px;height:14px;}
.quiz-msg{font-size:12.8px;color:#9db2c2;}

.result-box{display:none;text-align:center;padding:30px 10px 10px;}
.result-box.show{display:block;}
.result-ring{
  width:120px;height:120px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--amber) calc(var(--pct,0)*1%), rgba(255,255,255,.12) 0);
  position:relative;
}
.result-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--navy);}
.result-ring b{position:relative;z-index:2;font-family:'Cairo';font-size:24px;font-weight:800;}
.result-name{font-family:'Cairo';font-weight:700;font-size:16px;margin-bottom:4px;}
.result-sub{color:#9db2c2;font-size:13px;margin-bottom:20px;}

/* results/admin page */
.admin-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.admin-toolbar input{
  flex:1;min-width:180px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);font-family:inherit;font-size:13.6px;
}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center;}
.stat-card b{display:block;font-family:'Cairo';font-size:22px;font-weight:800;color:var(--navy);}
.stat-card span{font-size:11.5px;color:var(--muted);}

/* footer nav (prev/next) */
.unit-nav{display:flex;justify-content:space-between;margin-top:46px;gap:12px;flex-wrap:wrap;}
.unit-nav a{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;
  display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:13.5px;
}
.unit-nav a .lbl{color:var(--muted);font-size:11.5px;display:block;}
.unit-nav a b{font-family:'Cairo';font-size:14px;}
.unit-nav a.next{justify-content:flex-start;text-align:right;}
.unit-nav a svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted);}
.chev{width:16px;height:16px;flex:0 0 16px;}
.hero-eyebrow svg{width:14px;height:14px;}

/* real photographs (Wikimedia Commons) */
.photo-wrap{margin:20px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0c0c0c;}
.photo-wrap img{width:100%;height:auto;max-height:380px;object-fit:cover;display:block;}
.photo-cap{background:var(--card);padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);}
.photo-cap a{color:var(--steel);}
.photo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);}
.photo-strip-2col{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0;}
.pf2{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.pf2 img{width:100%;height:auto;display:block;}
.pf2 figcaption{padding:9px 12px;font-size:11.8px;color:var(--muted);border-top:1px solid var(--line);}
@media (max-width:600px){.photo-strip-2col{grid-template-columns:1fr;}}
.photo-strip .pstrip-item{background:#fff;display:flex;flex-direction:column;align-items:center;padding:10px 6px 12px;}
.photo-strip .pstrip-item img{width:100%;max-width:120px;height:auto;margin-bottom:6px;}
.photo-strip .pstrip-item span{font-size:11.5px;color:var(--ink);font-weight:700;text-align:center;}
@media (max-width:600px){.photo-strip{grid-template-columns:repeat(2,1fr);}}

/* embedded video */
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px;margin:20px 0 0;border:1px solid var(--line);background:#000;}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.video-cap{font-size:12px;color:var(--muted);margin:8px 0 20px;}

/* external video reference links (not embedded) */
.video-links{background:#eef4f8;border:1px solid #c9dde8;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:13.3px;color:#274a5c;}
.video-links b{font-family:'Cairo';display:block;margin-bottom:6px;}
.video-links ul{margin:6px 0 0;padding-inline-start:18px;}
.video-links a{color:var(--steel);font-weight:700;}

/* Instagram reference links */
.ig-links{background:#fdf1f6;border:1px solid #f3c9de;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:13.3px;color:#7a2450;}
.ig-links b{font-family:'Cairo';display:block;margin-bottom:6px;}
.ig-links ul{margin:6px 0 0;padding-inline-start:18px;}
.ig-links a{color:#c22a7a;font-weight:700;}
.ig-acc{color:#a3557f;font-size:12px;}
.illus-wrap{margin:20px 0;background:#fbfbf6;border:1px solid var(--line);border-radius:14px;padding:22px 18px 16px;text-align:center;}
.illus-wrap svg{max-width:100%;height:auto;}
.illus-cap{font-size:12.3px;color:var(--muted);margin-top:10px;}

/* animated interactive demonstrations (in place of video) */
.anim-wrap{margin:20px 0;background:var(--navy);border-radius:14px;padding:24px 20px 18px;color:#fff;text-align:center;}
.anim-label{font-size:11px;color:var(--amber);letter-spacing:.3px;margin-bottom:14px;font-family:'Cairo';font-weight:800;}
.anim-wrap svg{max-width:100%;height:auto;}
.anim-cap{font-size:12.5px;color:#bcd0d8;margin-top:14px;}

@keyframes cprPress{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
@keyframes cprChest{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.92);}}
.cpr-hands{animation:cprPress 0.86s ease-in-out infinite;transform-origin:center;}
.cpr-chest{animation:cprChest 0.86s ease-in-out infinite;transform-origin:center;}

@keyframes sprayMove{0%,100%{transform:translateX(-14px);}50%{transform:translateX(14px);}}
@keyframes fireShrink{0%{transform:scale(1);opacity:1;}70%{transform:scale(.35);opacity:.5;}100%{transform:scale(1);opacity:1;}}
.spray-cone{animation:sprayMove 1.4s ease-in-out infinite;transform-origin:center;}
.fire-flame{animation:fireShrink 2.8s ease-in-out infinite;transform-origin:bottom center;}
/* tablet & mobile (≤880px) */
@media (max-width:880px){
  #topbar{padding:12px 16px;}
  #results-topbtn span{display:none;}
  .wrap{padding:32px 20px 70px;}
  .hero{padding:40px 20px 46px;}
  .hero h1{font-size:28px;}
  .unit-grid{grid-template-columns:1fr;padding:0 20px;}
  .unit-head{padding:26px 20px 26px;}
  .uh-title{font-size:22px;}
  .stu-form{grid-template-columns:1fr;}
  .flip-grid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .slide-card{padding:26px 22px;}
  .quiz-wrap{padding:26px 20px 30px;}
}

/* small phones (≤480px) */
@media (max-width:480px){
  .wrap{padding:26px 14px 60px;}
  .hero{padding:34px 14px 40px;}
  .hero h1{font-size:23px;}
  .hero p{font-size:14.5px;}
  .hero-eyebrow{font-size:11.5px;padding:5px 12px;}
  .hstat b{font-size:21px;}
  .unit-grid{padding:0 14px;gap:12px;}
  .unit-card{padding:16px 16px 14px;}
  .unit-head{padding:20px 14px 22px;}
  .uh-icon{width:44px;height:44px;flex:0 0 44px;border-radius:11px;}
  .uh-icon svg{width:24px;height:24px;}
  .uh-title{font-size:19px;}
  .uh-goal{padding:13px 14px;font-size:13px;}
  .slide-card{padding:20px 16px;border-radius:16px;min-height:260px;}
  .slide-card h2{font-size:18px;}
  .slide-counter{font-size:11px;}
  .quiz-wrap{padding:20px 14px 26px;border-radius:16px;}
  .quiz-head h2{font-size:17px;}
  .quiz-head .ic{width:34px;height:34px;flex:0 0 34px;}
  .q-block{padding:13px 14px;}
  .q-text{font-size:13.8px;}
  .btn{padding:12px 18px;font-size:13.3px;}
  .unit-nav a{padding:12px 14px;font-size:12.8px;}
  .card{padding:15px 16px;}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:8px;}
  .stat-card{padding:12px 10px;}
  .stat-card b{font-size:19px;}
  .admin-toolbar input{min-width:100%;}
}
.dl-fallback-bar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-size:13px;max-width:92vw;flex-wrap:wrap;justify-content:center;
}
.dl-fallback-bar a{background:var(--amber);color:#20140a;font-weight:800;padding:7px 14px;border-radius:8px;text-decoration:none;}
.dl-fallback-bar button{background:none;border:none;color:#9db2c2;font-size:15px;cursor:pointer;padding:2px 6px;}
</style>
</head>

function ic(name, cls){return `<span class="${cls||''}">${ICONS[name]||''}</span>`;}

// helper: accordion item markup (index, title, body-html)
function accItem(idx,title,bodyHtml){
  return `<div class="acc-item">
    <div class="acc-h" onclick="this.parentElement.classList.toggle('open')">
      <b><span class="idx">${String(idx).padStart(2,'0')}</span>${title}</b>
      ${ICONS.chevron}
    </div>
    <div class="acc-body"><div class="acc-body-in">${bodyHtml}</div></div>
  </div>`;
}
// helper: tabs block. id must be unique per instance. panels = [[label, html], ...]
function tabsBlock(id, panels){
  const btns = panels.map((p,i)=>`<button class="tab-btn${i===0?' active':''}" onclick="switchTab('${id}',${i},this)">${p[0]}</button>`).join('');
  const body = panels.map((p,i)=>`<div class="tab-panel${i===0?' active':''}" data-tab="${id}-${i}">${p[1]}</div>`).join('');
  return `<div class="tabs" data-tabgroup="${id}">${btns}</div><div class="tab-panels">${body}</div>`;
}
// helper: flip card grid. items = [[icon,title,backText],...]
function flipGrid(items){
  return `<div class="flip-grid">` + items.map(it=>`
    <div class="flip-card" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-face flip-front">
          <div class="ic" style="background:#eef4f8;color:#3f6b8a">${ICONS[it[0]]||''}</div>
          <b>${it[1]}</b><span class="hint">اضغط لعرض التفاصيل</span>
        </div>
        <div class="flip-face flip-back"><b>${it[1]}</b>${it[2]}</div>
      </div>
    </div>`).join('') + `</div>`;
}
// helper: colored pyramid rows. rows=[[label,sub,color],...] top-to-bottom
function pyramidBlock(rows){
  return `<div class="pyramid">` + rows.map((r,i)=>`
    <div class="pyr-row" style="background:${r[2]}"><span class="n">${i+1}</span><div>${r[0]}<small>${r[1]}</small></div></div>`).join('') + `</div>`;
}
// helper: signage color chip list. items=[[hex,title,desc],...]
function chipList(items){
  return `<div class="card">` + items.map(it=>`
    <div class="chip-row"><div class="chip-sw" style="background:${it[0]}"></div><div><b>${it[1]}</b><span>${it[2]}</span></div></div>`).join('') + `</div>`;
}
// helper: checklist (non-graded, just interactive ticking)
function checklistBlock(items){
  return `<ul class="check-list">` + items.map((t,i)=>`
    <li onclick="this.classList.toggle('checked')"><input type="checkbox" onclick="event.stopPropagation();this.closest('li').classList.toggle('checked')"><span>${t}</span></li>`).join('') + `</ul>`;
}
// helper: simple icon grid item list builder -> [[icon,bg,color,title,desc]]
function iconGrid(items){
  return `<div class="igrid">` + items.map(it=>`
    <div class="iitem"><div class="ic" style="background:${it[1]};color:${it[2]}">${ICONS[it[0]]||''}</div><div><h4>${it[3]}</h4><p>${it[4]}</p></div></div>`).join('') + `</div>`;
}
// helper: rich illustration figure (original SVG diagram + caption)
function illus(svg, caption){
  return `<div class="illus-wrap">${svg}<div class="illus-cap">${caption}</div></div>`;
}
// helper: animated interactive demonstration (stands in for video)
function animDemo(label, svg, caption){
  return `<div class="anim-wrap"><div class="anim-label">${label}</div>${svg}<div class="anim-cap">${caption}</div></div>`;
}
// helper: real photograph — accepts either a Wikimedia Commons filename
// (resolved via the stable Special:FilePath link) or a data: URI (for images
// embedded directly from the source training manual)
function photo(fileOrDataUri, caption, credit){
  const url = fileOrDataUri.startsWith('data:')
    ? fileOrDataUri
    : `https://commons.wikimedia.org/wiki/Special:FilePath/${fileOrDataUri}`;
  return `<div class="photo-wrap"><img src="${url}" alt="${caption}" loading="lazy" onerror="this.closest('.photo-wrap').style.display='none'">
  <div class="photo-cap">${caption}${credit?` — <span>${credit}</span>`:''}</div></div>`;
}
// helper: a row of small sequential photos (e.g. PASS technique steps)
function photoStrip(items, caption){
  const imgs = items.map(it=>{
    const url = it[0].startsWith('data:')
      ? it[0]
      : `https://commons.wikimedia.org/wiki/Special:FilePath/${it[0]}`;
    return `<div class="pstrip-item"><img src="${url}" alt="${it[1]}" loading="lazy" onerror="this.parentElement.style.display='none'"><span>${it[1]}</span></div>`;
  }).join('');
  return `<div class="photo-wrap"><div class="photo-strip">${imgs}</div><div class="photo-cap">${caption}</div></div>`;
}
// helper: embedded YouTube video
function videoEmbed(youtubeId, caption){
  return `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${youtubeId}" title="${caption}" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
  <div class="video-cap">${caption}</div>`;
}
// helper: external (non-embedded) video reference links for further viewing
function videoLinks(items){
  return `<div class="video-links"><b>مقاطع فيديو مقترحة للاستزادة (روابط خارجية للمشاهدة عند توفر الإنترنت)</b><ul>` +
    items.map(it=>`<li><a href="${it[1]}" target="_blank" rel="noopener">${it[0]}</a></li>`).join('') + `</ul></div>`;
}
// helper: مقاطع محاكاة/تحفيزية من حسابات رسمية موثّقة على إنستجرام (روابط خارجية، غير مُضمَّنة)
function igLinks(items){
  return `<div class="ig-links"><b>${ICONS.instagram||''} مقاطع محاكاة من إنستجرام</b><ul>` +
    items.map(it=>`<li><a href="${it[1]}" target="_blank" rel="noopener">${it[0]}</a>${it[2]?` <span class="ig-acc">— ${it[2]}</span>`:''}</li>`).join('') + `</ul></div>`;
}

<div class="card">

</div>
<p>يجب أن تكون هناك أماكن عمل مناسبة حول المعدات الكهربائية لتسهيل الوصول إليها للفحص والضبط الدوري، بأرضيات راسخة ومأمونة خارج منطقة الخطر.</p>

{h:"مفهوم الصحة المهنية", body:`
<p>الصحة المهنية هي <b>العلم الذي يتعلق بالتعرّف والتقييم والسيطرة على ظروف العمل المختلفة التي قد تؤدي إلى إصابة العاملين وتعرّض صحتهم للخطر.</b> يستخدم أخصائي الصحة المهنية القياسات البيئية والطرق التحليلية لتحديد مدى تعرّض العاملين للمخاطر، ثم يطبّق طرق السيطرة المناسبة وفق ثلاث خطوات متتالية: التعرّف على المخاطر، ثم تقييم درجة خطورتها، ثم السيطرة عليها بالترتيب الهرمي المناسب.</p>
${photo(DOCIMG.scba_worker, "تقييم المخاطر المهنية يشمل بيئات تستدعي معدات وقاية خاصة كأجهزة التنفس")}`},
{h:"أنواع المخاطر الأربعة في بيئة العمل", body:`
${iconGrid([
 ["bolt","#fbeceA","#c8341f","مخاطر كيميائية","أبخرة وغازات وأتربة ودخان ورذاذ، تدخل الجسم عبر الاستنشاق أو الجلد أو البلع أو الحقن الخاطئ."],
 ["fire","#fdf2e3","#c97f00","مخاطر طبيعية","الحرارة والرطوبة، الضوء، الضوضاء، الإشعاع، الضغط الجوي، والاهتزازات."],
 ["health","#eaf5ee","#2f7a4f","مخاطر بيولوجية","بكتيريا وفيروسات تدخل الجسم، وتزيد خطورتها عند وجود جروح؛ أكثرها انتشاراً في المعامل والمزارع."],
 ["gear","#eef4f8","#3f6b8a","مخاطر هندسية","مخاطر ميكانيكية (من الآلات)، ومخاطر كهربائية (من التوصيلات)، ومخاطر إرجونومية (عدم ملاءمة ظروف العمل للعامل)."]
])}
${photo(DOCIMG.particle_diameters, "مخطط أقطار الجسيمات (بالميكرون) — الأدخنة والأتربة والرذاذ، من الحقيبة التدريبية")}`},
{h:"المخاطر الكيميائية: طرق الدخول وأنواع الملوثات", body:`
<p class="lead">تعتمد درجة خطورة المادة الكيميائية على تركيزها ومدة التعرّض لها. تدخل هذه المواد إلى جسم الإنسان بأربع طرق:</p>
<div class="tbl-wrap"><table><tr><th>الترتيب</th><th>طريقة الدخول</th><th>ملاحظة</th></tr>
<tr><td>1</td><td>الاستنشاق</td><td><b>أسرع طريق</b> لدخول المواد الكيميائية الضارة إلى الجسم</td></tr>
<tr><td>2</td><td>الامتصاص خلال الجلد والعينين</td><td>يزداد الخطر مع تلف الجلد أو رطوبته</td></tr>
<tr><td>3</td><td>البلع</td><td>غالباً عبر التلوث غير المقصود لليدين أو الطعام</td></tr>
<tr><td>4</td><td>الحقن الخاطئ</td><td>عبر جرح مفتوح يتصل بمادة كيميائية</td></tr>
</table></div>

  <circle cx="205" cy="33" r="2.6" fill="#c8341f"/>

  <circle cx="215" cy="145" r="7" fill="none" stroke="#2f7a4f" stroke-width="2.2"/>

  <text x="30" y="22" font-size="11.5" fill="#c8341f" font-family="Cairo, sans-serif" font-weight="700">1 الاستنشاق</text>

</svg>`, "الطرق الأربع لدخول المواد الكيميائية إلى جسم الإنسان")}
<p class="lead">أنواع الملوثات الكيميائية الصلبة المحمولة بالهواء:</p>
${photo(DOCIMG.particle_diameters, "مخطط أقطار الجسيمات (بالميكرون) — الأدخنة والأتربة والرذاذ، من الحقيبة التدريبية")}
${flipGrid([
 ["bolt","أتربة (Dusts)","حجمها من 0.1 إلى 10 ميكرون. الأتربة الأقل من 10 ميكرون تسمى «المستنشقة» وهي الأخطر لأنها تترسب في الحويصلات الهوائية بالرئتين وقد تسبب السيليكوزيس."],
 ["fire","أدخنة (Fumes)","جسيمات دقيقة جداً (أقل من ميكرون واحد) تنتج من تكثيف أبخرة المعادن المنصهرة، مثل أدخنة اللحام."],
 ["health","رذاذ (Mist)","قطرات سوائل عالقة بالهواء، تنتج من تكثيف الأبخرة، مثل رذاذ الأحماض في الطلاء الكهربائي."],
 ["gear","ألياف (Fibers)","مواد صلبة طولها أكبر من قطرها بمرات عديدة، كألياف الأسبستوس والفايبرجلاس."]
])}`},
{h:"هرم السيطرة على المخاطر", body:`
<p class="lead">يُتّبع نظام هرم السيطرة بالترتيب التنازلي التالي — فكلما ارتفعنا في الترتيب زادت فعالية الحل الوقائي:</p>
${pyramidBlock([
 ["الإزالة (Elimination)","التخلص من مصدر الخطر كلياً من بيئة العمل","#7d2416"],
 ["الإحلال / التعويض (Substitution)","استبدال المادة أو العملية الخطرة بأخرى أقل خطورة","#c8341f"],
 ["العزل (Isolation)","فصل مصدر الخطر عن العامل بحاجز أو مسافة","#c97f00"],
 ["التحكم الهندسي (Engineering Control)","تعديل التصميم أو التهوية أو المعدات لتقليل التعرض","#f0a202"],
 ["التحكم الإداري (Administrative Control)","إجراءات العمل، جدولة المناوبات، التدريب والتوعية","#3f6b8a"],
 ["مهمات الوقاية الشخصية (PPE)","آخر خط دفاع عندما لا تكفي الحلول السابقة","#2f7a4f"]
])}
<div class="callout warn"><b>لماذا هذا الترتيب؟</b>مهمات الوقاية الشخصية تحمي فرداً واحداً وتعتمد على استخدامه الصحيح لها، بينما الإزالة والإحلال يحميان جميع العاملين بشكل دائم — لذلك تُفضَّل الحلول الهندسية على الحلول الشخصية كلما أمكن.</div>
${photo(DOCIMG.control_methods, "مخطط عام لطرق التحكم بالمخاطر: المصدر ← مسار الانتقال ← المتلقي، من الحقيبة التدريبية")}`},
{h:"تصنيف المناطق الخطرة", body:`
<p>المناطق الخطرة هي المناطق التي يكون فيها خطر حدوث حريق أو انفجار كبيراً؛ لوجود غازات أو أبخرة أو سوائل أو أتربة أو ألياف قابلة للاشتعال.</p>
${accItem(1,"التصنيف الأول (Class I)", "مواقع مشبعة بالغازات والأبخرة القابلة للاشتعال، مثل مصافي البترول ومعامل الغاز ومحطات البنزين.")}
${accItem(2,"التصنيف الثاني (Class II)", `مواقع مشبعة بغبار وأتربة قابلة للاشتعال، مثل مطاحن الدقيق ومصانع بودرة الألومنيوم والماغنسيوم.${photo(DOCIMG.class2_division, "مثال على القسمين 1 و2 ضمن التصنيف الثاني — غبار قابل للاشتعال في الظروف العادية مقابل غير العادية")}`)}
${accItem(3,"التصنيف الثالث (Class III)", "مواقع بها ألياف وأنسجة صناعية قابلة للاشتعال، مثل مصانع النسيج وحلج الأقطان.")}
<h3>الأقسام (Divisions)</h3>
<p><b>القسم 1:</b> تُفترض فيه المواد القابلة للاشتعال متوفرة في الظروف العادية وخلال العمليات اليومية (كأثناء رش السيارات).<br>
<b>القسم 2:</b> تُفترض فيه المواد القابلة للاشتعال متوفرة فقط في ظروف غير عادية، كحوادث التسرب الناتجة عن أعطال المعدات.</p>
<p>لهذا تُستخدم في التصنيف الأول أجهزة كهربائية محفوظة داخل صناديق مقاومة للانفجار، وفي التصنيف الثاني أجهزة عازلة للأتربة، وفي التصنيف الثالث أجهزة تمنع دخول الألياف إليها.</p>
${videoLinks([
 ["شرح مبسّط عن مخاطر بيئة العمل والصحة المهنية", "https://www.youtube.com/watch?v=tZIGzdJP5ZQ"]
])}`}
],

// ============================================================
// UNIT 3 — مهمات السلامة للوقاية الشخصية
// ============================================================
const UNIT3 = {
id:"u3", num:3, icon:"ppe", color:"#c97f00",
title:"مهمات السلامة للوقاية الشخصية",
short:"وقاية الرأس والعين والأذن واليد والقدم والجهاز التنفسي، والعلامات الإرشادية والتحذيرية.",
goal:"الإنجازات الأساسية لمعرفة معدات السلامة الشخصية وطرق استخدامها وفحصها والمحافظة عليها.",
objectives:[
"يذكر الإرشادات العامة لمهمات السلامة الشخصية","يحصر معدات الوقاية الشخصية ويصنفها",
"يختار المعدة المناسبة لكل عمل مطلوب","يعرف طريقة فحص أجهزة التنفس","يلمّ بأنواع اللوحات الإرشادية"
],
sections:[
{h:"إرشادات عامة", body:`
${checklistBlock([
 "حدِّد نوع المخاطر في مكان العمل أولاً، ثم حدِّد معدات الوقاية المطلوبة",
 "توفَّر معدات الوقاية الشخصية دون تحميل أي تكلفة مادية على العامل",
 "تُستخدم معدات معتمدة من السلطات المحلية ومتوافقة مع المواصفات القياسية (كمواصفات OSHA)",
 "تُرتدى المعدات بطريقة تلائم مقاس الشخص المستخدم لها",
 "يُجرى فحص طبي دوري (سنوي) للعاملين الذين تستدعي طبيعة عملهم استخدام أجهزة التنفس",
 "يُدرَّب جميع العاملين على الطريقة الصحيحة لاستعمال معداتهم قبل البدء بالعمل",
 "تُحفظ المعدات غير المستخدمة في أكياس بلاستيكية نظيفة"
])}
${photo(DOCIMG.helmet_plain, "خوذة سلامة قياسية — من مهمات الوقاية الشخصية الأساسية في أي موقع عمل صناعي")}`},
{h:"وقاية الرأس: الخوذات", body:`
<p>تُستخدم الخوذة الصلبة لحماية الرأس من الصدمات الثقيلة والاختراق بالأجسام الساقطة، وهي مزودة من الداخل برباط وبطانة تمتص صدمة الأجسام الساقطة. المخاطر الأساسية على الرأس هي المعدات المتساقطة والاصطدام بأجسام صلبة والمخاطر الكهربائية.</p>
${photo(DOCIMG.helmet_cutaway, "مقطع داخلي لخوذة السلامة يوضح البطانة والمسافة الآمنة بين الغطاء الخارجي والرأس")}
<div class="tbl-wrap"><table><tr><th>الدرجة</th><th>الاستخدام</th><th>الحماية من الصدمات</th><th>الحماية الكهربائية</th></tr>
<tr><td>الدرجة أ (Class A)</td><td>الأعمال الخفيفة</td><td>محدودة</td><td>محدودة (حتى 2200 فولت لمدة دقيقة)</td></tr>
<tr><td>الدرجة ب (Class B)</td><td>الأعمال الشاقة</td><td>كبيرة</td><td>كبيرة (حتى 20000 فولت لمدة 3 دقائق)</td></tr>
<tr><td>الدرجة ج (Class C)</td><td>أعمال عامة (ألمنيوم)</td><td>جيدة</td><td>لا توجد أي حماية كهربائية</td></tr>
</table></div>
<p>قبل الاستخدام، تأكد دائماً من خلوّ الخوذة من التشققات أو الصدمات، ومن أن الأربطة والبطانة الداخلية غير ممزقة.</p>`},
{h:"وقاية العين والوجه والأذن", body:`
<p>لوقاية العين والوجه من المخاطر الكيميائية والميكانيكية تُستخدم النظارات الواقية أو النظارات الزجاجية أو حامي الوجه، وذلك في أعمال الجلخ والتقطيع، وتداول المواد الكيميائية، وعمليات الأفران واللحام.</p>
${photo(DOCIMG.eye_face_chart, "دليل مصوَّر لأنواع واقيات العين والوجه المعتمدة (النظارات، الأقنعة، وواقيات اللحام) من الحقيبة التدريبية")}
${photoStrip([
 [DOCIMG.goggles_clear, "نظارة واقية شفافة"],
 [DOCIMG.goggles_wide, "نظارة واقية بتهوية"],
 [DOCIMG.face_shield, "واقي الوجه الكامل"]
], "نماذج حقيقية لواقيات العين والوجه — من الحقيبة التدريبية")}
<div class="callout info"><b>حماية السمع</b>يجب على العاملين في أماكن تزيد شدة الضوضاء فيها عن <b>85 ديسيبل</b> ارتداء واقيات الأذن. تُستخدم <b>أغطية الأذن</b> عندما تكون شدة الضوضاء مرتفعة جداً، أو <b>سدادات الأذن</b> للمستويات المتوسطة. أما الحد الأقصى المسموح للتعرض دون حماية طوال يوم العمل (8 ساعات) فهو <b>90 ديسيبل</b>، وعند بلوغه يجب البدء فوراً بخطوات حماية القوى السمعية للعاملين.</div>
${photoStrip([
 [DOCIMG.earplugs, "سدادات الأذن (PVC وإسفنجية)"],
 [DOCIMG.earmuffs, "أغطية الأذن (Ear Muffs)"]
], "نوعان شائعان من واقيات السمع — من الحقيبة التدريبية")}
<p>تتكون الأذن البشرية من ثلاثة أجزاء: الخارجية (تجمع الموجات الصوتية)، الوسطى (المطرقة والركاب والسندان)، والداخلية (تحتوي شعيرات دقيقة تتصل بالعصب السمعي وتتلف تدريجياً مع طول التعرض للضوضاء دون أن يشعر الشخص بذلك، حتى يفقد سمعه تماماً).</p>`},

{h:"وقاية الجهاز التنفسي", body:`
<p class="lead">تُقسَّم أجهزة التنفس إلى قسمين رئيسين:</p>
${accItem(1,"أجهزة تنفس مزوِّدة للهواء", `مثل أجهزة التنفس الذاتية (SCBA): أسطوانة هواء مضغوط تكفي لمدة نصف ساعة إلى ساعة، مع منظم ضغط وخرطوم متصل بالقناع، وجهاز تنبيه صوتي قبل انتهاء الهواء بخمس دقائق. توفر حماية كاملة حتى في الأماكن التي تقل فيها نسبة الأوكسجين اللازمة للتنفس.${photo(DOCIMG.scba_worker, "عامل يرتدي جهاز تنفس ذاتي (SCBA) مزوَّد بأسطوانة هواء مضغوط على الظهر")}`)}
${accItem(2,"أجهزة تنفس منقِّية للهواء", "تنقّي هواء التنفس من المواد الخطرة، ولكنها <b>لا تزوّد العامل بالأوكسجين</b>. لذلك لا تُستعمل أبداً في أماكن نقص الأوكسجين أو حين تكون تركيزات المواد السامة مجهولة أو عالية جداً (خطر مباشر على الحياة).")}
<div class="callout danger"><b>اترك المكان فوراً عند استخدام جهاز التنفس المنقي إذا</b>شعرت بصعوبة التنفس، أو شممت رائحة أو طعم المواد الموجودة، أو شعرت بالدوار، أو حدث تلف بالجهاز.</div>
<div class="card"><h3>اختبار ملاءمة القناع للوجه</h3><ul>
<li><b>فحص الضغط السالب:</b> يُغلق فتحتا دخول الهواء بالفلتر بالكفين، ويبدأ التنفس حتى ينبعج القناع؛ فإذا بقي منبعجاً بعد التوقف عن التنفس لعشر ثوانٍ، يكون الجهاز مربوطاً جيداً.</li>
<li><b>فحص الضغط الموجب:</b> يُغلق فتحة خروج الهواء ويُزفر بهدوء؛ فإن لم يتسرّب الهواء بين الوجه والقناع، يكون مربوطاً جيداً.</li>
</ul></div>`},
{h:"العلامات الإرشادية والتحذيرية", body:`
<p class="lead">تُستخدم الألوان المميزة لتوضيح نوع الخطر وتساعد العامل على التعرف على درجة خطورته بسرعة (حسب مواصفات OSHA وANSI):</p>
${chipList([
 ["#c8341f","الأحمر","خطر مباشر — أزرار الإيقاف في حالات الطوارئ"],
 ["#f0a202","البرتقالي","تحذير — أجزاء متحركة من المعدات"],
 ["#e8d000","الأصفر","تحذير من مخاطر التعثر أو السقوط — حاويات المواد المتفجرة والآكلة"],
 ["#2f7a4f","الأخضر","الأمان — أماكن الإسعافات الأولية ومعدات السلامة"],
 ["#111827","أسود مع أبيض/أصفر","الحدود — علامات المرور والسلالم والاتجاهات"],
 ["#6b3fa0","البنفسجي","التحذير من الإشعاع — الأشعة السينية والمواد المشعة"]
])}
<p class="lead">تُقسَّم العلامات التحذيرية حسب مواصفات OSHA إلى ثلاثة أنواع:</p>
${tabsBlock("t2u3",[
 ["علامات الخطر","تُظهر وجود خطر وشيك وضرورة اتخاذ إجراءات احترازية فورية، بالألوان الأحمر والأسود والأبيض."],
 ["علامات التحذير","تحذّر من مخاطر كامنة أو تصرفات غير آمنة، بخلفية صفراء وكتابة سوداء."],
 ["علامات الإرشادات","تُستخدم للإرشادات العامة والاقتراحات المتعلقة بالسلامة، بخلفية بيضاء ونافذة خضراء وحروف بيضاء."]
])}
<h3>ترميز خطوط الأنابيب حسب درجة الخطورة</h3>
<div class="tbl-wrap"><table><tr><th>نوع المادة</th><th>ألوان الترميز</th></tr>
<tr><td>مواد عالية الخطورة (آكلة، سامة، مشعة)</td><td>حروف سوداء على خلفية صفراء</td></tr>

<p class="lead">أربعة أنواع من حواجز الحماية — اضغط على كل نوع لعرض شرحه وصورته:</p>
${accItem(1,"حواجز ثابتة", `جزء ثابت يُركَّب فوق الأجزاء الدوارة الخطرة، بفتحات تهوية صغيرة لا تسمح بوصول أي جزء من الجسم إليها، ولا يمكن فكها إلا بمعدات خاصة.${photo(DOCIMG.fixed_guard_real, "حاجز ثابت حقيقي (Fixed Guard)")}`)}

${accItem(3,"حاجز قابل للتعديل", `يستطيع العامل تعديل موضعه ليغطي منطقة الخطر، كما في المنشار الرأسي.${photo(DOCIMG.blade_guard, "حاجز قابل للتعديل على منشار دائري — يغطي الشفرة مع السماح بتمرير القطعة المراد قصّها")}`)}

${accItem(7,"نظام الإيقاف المحدد", "يربط أيدي العامل بواسطة واير محدود الطول لا يسمح بالوصول لنقطة الخطر مطلقاً.")}

// ============================================================
// UNIT 5 — الخطر الكهربائي على جسم الإنسان وأنواع الإصابات والإغاثة منها
// ============================================================
const UNIT5 = {

title:"الخطر الكهربائي على جسم الإنسان، وأنواع الإصابات والإغاثة منها",

goal:"معرفة مصادر الخطر الكهربائي على جسم الإنسان، وأنواع الإصابات الناتجة عنه، وطرق الإغاثة والوقاية منه.",
objectives:[
"يحدد المتدرب أسباب الإصابة بالتيار الكهربائي","يوضح آثار مرور التيار في جسم الإنسان",
"يذكر أنواع الإصابات الكهربائية","يطبق خطوات إغاثة المصاب بالتيار الكهربائي","يذكر وسائل الوقاية من مخاطر الكهرباء"
],
sections:[
{h:"أسباب الإصابة بالتيار الكهربائي", body:`
<p class="lead">تنشأ مخاطر الكهرباء من أخطاء تقع في مراحل مختلفة:</p>
${tabsBlock("t1u5",[
 ["مرحلة التصميم","عدم إعداد التصميم بواسطة مهندس كهرباء متخصص، عدم ملاءمة قواطع الحماية مع مقاطع الأسلاك، عدم استخدام قواطع حماية من تيار التسرب الأرضي في الحمامات والمطابخ، غياب موصل التأريض ونظام مانعات الصواعق."],
 ["مرحلة التنفيذ","غياب مهندس كهربائي مُشرف على التنفيذ، عدم التقيد بالمخططات الكهربائية، عدم استعمال المرابط الخاصة لربط الأسلاك، عدم ربط موصلات التأريض بمرابطها المخصصة."],
 ["مرحلة الاستخدام","توصيل عدة أجهزة بمقبس واحد، لمس الأجهزة بأيدٍ مبتلة، نزع القابس بعنف، إهمال الصيانة الدورية وفحص التمديدات."]
])}
<p class="lead">وتشمل أسباب الإصابة المباشرة:</p>
<div class="card"><ul>
<li>ملامسة التوصيلات الكهربائية الحاملة للتيار مباشرة</li>
<li>ملامسة أجزاء ناقلة غير حاملة للتيار في حالتها الطبيعية، لكنها أصبحت تحت التوتر بسبب عطل (مثل هياكل المعدات المعدنية عند انهيار العزل)</li>
<li>حدوث القوس الكهربائي عبر دائرة قصر أو فصل خاطئ لقواطع السكين، مع انتشار حرارة كبيرة قد تسبب حروقاً أو العمى</li>
<li>وقوع تجهيزات الجهد المنخفض تحت أثر الجهد العالي نتيجة قصر بين ملفات المحول</li>
<li>آثار الكهرباء الساكنة المتراكمة نتيجة الحركة أو السحب أو التلامس</li>
</ul></div>
${photo(DOCIMG.arc_accident, "حادثة تماس كهربائي حقيقية أثناء العمل على سقالة معدنية — توضح خطورة الاقتراب من الأجزاء المكهربة دون عزل")}`},
{h:"شدة التيار وتأثيره في جسم الإنسان", body:`
<p>تعتمد مقاومة جسم الإنسان على حالة الجلد؛ فالجلد الجاف السليم يمثل مقاومة أعلى، بينما تنخفض المقاومة مع زيادة الرطوبة أو التعرق أو ازدياد الجهد المطبق. وشدة التيار هي العامل الحاسم في تحديد خطورة الصدمة، كما يوضح الجدول التالي:</p>
<div class="tbl-wrap"><table><tr><th>شدة التيار (ملي أمبير)</th><th>التأثير على جسم الإنسان</th></tr>
<tr><td>1 - 8</td><td>تقلص غير مؤلم للعضلات، يمكن للمصاب التخلص من مصدر الصدمة بنفسه</td></tr>
<tr><td>8 - 15</td><td>تقلص مؤلم، لكن التحكم بالعضلات ما زال موجوداً؛ يمكن التخلص دون مساعدة</td></tr>
<tr><td>15 - 20</td><td>يشتد الألم، ويفقد المصاب التحكم في العضلات، ويحتاج مساعدة خارجية</td></tr>
<tr><td>20 - 50</td><td>ألم شديد، وتقلص شديد بالعضلات، وصعوبة كبيرة في التنفس</td></tr>
<tr><td>50 - 100</td><td>اختلال في وظيفة القلب، وقد يؤدي إلى الوفاة عند بعض المصابين</td></tr>
<tr><td>أكثر من 100</td><td>توقف القلب عن العمل، والمساعدة الطبية لا تجدي غالباً</td></tr>
</table></div>
<div class="callout danger"><b>الجهد الآمن</b>الجهد بين 24 و50 فولت لا يؤثر عادة على الإنسان ويُعتبر جهداً آمناً نسبياً، ضمن شروط معينة.</div>
${photo(DOCIMG.body_tolerance, "مدى تحمّل جسم الإنسان لشدة التيار الكهربائي (بالميلي أمبير) من الحقيبة التدريبية")}
${photo(DOCIMG.current_pathways, "مسارات التيار الكهربائي الشائعة عبر جسم الإنسان — من الحقيبة التدريبية")}
<p class="lead">مسارات التيار الشائعة عبر جسم الإنسان: يد-يد، يد-قدم أو قدمين، قدم-قدم، رأس-يد أو رأس-قدم. وأخطر الحالات هي مرور التيار بطريق «يد إلى قدمين» لأن نسبة أكبر منه تعبر منطقة القلب.</p>`},
{h:"أنواع الإصابات الكهربائية", body:`
${accItem(1,"الصدمة الكهربائية (Electric Shock)", `ضرر يصيب أنسجة الجسم نتيجة تيار القصر أو القوس الكهربائي، وغالباً يكون سطحياً. تشمل: الحروق الكهربائية (تلامسية، قوسية، أو مختلطة)، الندبات الكهربائية (بقع جلدية تُشفى مع الزمن)، تمعدن الجلد (من ذرات المعدن المتصهر)، والأضرار الفيزيائية (تشقق الجلد، تمزق الأعصاب، كسر العظام) نتيجة التقلص العضلي الحاد.${photo(DOCIMG.arc_accident, "القوس الكهربائي أحد أسباب الصدمة الكهربائية — ينتج عنه حروق نتيجة الحرارة الشديدة المصاحبة له")}`)}
${accItem(2,"الصعقة الكهربائية (Electrocution)", "تهيّج الأنسجة الحية بمرور التيار، مترافق مع تقلص تشنجي لا إرادي للعضلات، وتُصنَّف إلى: تقلص بدون فقدان الوعي، أو تقلص مع فقدان الوعي مع استمرار التنفس وعمل القلب، أو تقلص مع توقف التنفس و/أو القلب — وهي الحالة الأخطر التي تتطلب تدخلاً إسعافياً فورياً.")}`},
{h:"إغاثة المصاب بالتيار الكهربائي", body:`
<p class="lead">يجب تخليص المصاب بأسرع ما يمكن من مصدر التماس، مع اتباع هذه الخطوات بالترتيب:</p>
${accItem(1,"تخليص المصاب بأمان","افصل التيار الكهربائي فوراً إن أمكن. إن لم يكن ذلك ممكناً، استخدم مادة عازلة وجافة (كخشب جاف) لإبعاد المصاب عن مصدر التماس — ولا تلمسه مباشرة أبداً حتى لا يتعرض المنقذ نفسه للخطر. استدع المساعدة الطبية فوراً.")}
${photo(DOCIMG.rescue_pull, "إخراج المصاب من منطقة الخطر باستخدام عصا أو أداة غير موصّلة للكهرباء، دون تلامس مباشر مع المصاب")}
${accItem(2,"التنفس الاصطناعي","إذا توقف تنفس المصاب، يُمال رأسه إلى الخلف لمنع اللسان من سد مجرى التنفس، ثم يُجرى التنفس الاصطناعي (بطريقة النفخ التي تُعد الأفضل) لتزويد الدم بالأوكسجين وتنشيط الدورة الدموية.")}
${accItem(3,"التدليك الخارجي للقلب","في حالة توقف القلب، يُجرى تدليك خارجي منتظم له لضمان استمرار تدفق الدم للأعضاء الحيوية كالمخ والكليتين. إذا توفر شخصان مدربان، يقوم أحدهما بالتنفس الاصطناعي والآخر بتدليك القلب بالتناوب (نحو 15 ضغطة متتالية مع كل دورتي نفخ).")}
${accItem(4,"المتابعة حتى وصول الإسعاف","استمر في الإجراءات ولا تتركها حتى وصول فرق الإسعاف المتخصصة، وراقب علامات الحياة كعودة النَبض والتنفس الذاتي.")}
${photo(DOCIMG.cpr_sequence, "تسلسل خطوات الإنعاش القلبي الرئوي من الحقيبة التدريبية")}
${animDemo("توضيح تفاعلي متحرك", `<svg viewBox="0 0 260 140" xmlns="http://www.w3.org/2000/svg">
  <rect class="cpr-chest" x="70" y="60" width="120" height="55" rx="16" fill="#1c3542" stroke="#3a5b68" stroke-width="2"/>
  <g class="cpr-hands">
    <ellipse cx="130" cy="66" rx="30" ry="12" fill="#f0a202"/>

<div class="callout warn"><b>احتياط عند جهد الخطوة</b>عند إنقاذ مصاب بالقرب من نقطة تسرّب أرضي (جهد الخطوة)، تجنّب الخطوات الكبيرة، ويُفضَّل القفز أو استخدام سلّم/ألواح خشبية للوصول إليه دون التأثر بفرق الجهد بين القدمين.</div>`},
{h:"الوقاية من مخاطر الكهرباء ونظام العزل والإغلاق", body:`
<p class="lead">للوقاية من مخاطر الكهرباء بشكل عام، يجب اتباع مبدأ <b>العزل والإغلاق (Lockout / Tagout)</b> قبل أي أعمال صيانة على المعدات الكهربائية:</p>
${accItem(1,"الإغلاق ووضع اللافتات (Lock-out / Tag-out)","تُستخدم أجهزة إغلاق وعزل خاصة لفصل مصدر القوى المحركة عن الآلة أو المعدة، مع وضع لافتة تحذيرية توضح أن العمل جارٍ ولا يجوز إعادة التشغيل.")}
${accItem(2,"تحديد جميع مصادر الطاقة","تحديد كل مصادر الطاقة المرتبطة بالمعدة (كهربائية، هوائية، هيدروليكية) والتي قد تسبب إصابة للعاملين إن بقيت متصلة أثناء الصيانة.")}
${photo(DOCIMG.energy_sources, "مصادر الطاقة الواجب عزلها قبل الصيانة: الكهرباء، الهواء المضغوط، الضغط الهيدروليكي، الغاز، والبخار")}

{h:"هرم الاشتعال وأنواع الحرائق", body:`
<p class="lead">يحتاج الاشتعال إلى توافر أربعة عناصر معاً، تُعرف بـ«هرم الاشتعال» — وغياب أي عنصر منها يوقف الحريق:</p>
${photo(DOCIMG.fire_triangle, "مثلث الاشتعال من الحقيبة التدريبية — إزالة أي ركن منه تُخمد الحريق")}
${pyramidBlock([

<p class="lead">وتُصنَّف الحرائق حسب نوع الوقود المشتعل إلى خمسة أنواع (النظام الأمريكي):</p>
<div class="tbl-wrap"><table><tr><th>النوع</th><th>مصدر الاشتعال</th><th>أفضل مواد الإطفاء</th></tr>
<tr><td>A</td><td>مواد صلبة: أخشاب، أوراق، ملابس، مطاط</td><td>الماء، وبعض طفايات البودرة الجافة</td></tr>
<tr><td>B</td><td>سوائل وغازات ملتهبة: بنزين، كيروسين، مذيبات، كحول</td><td>الرغاوى، ثاني أكسيد الكربون، البالون، البودرة (لا يُستخدم الماء)</td></tr>
<tr><td>C</td><td>معدات وأجهزة كهربائية</td><td>ثاني أكسيد الكربون، البالون، البودرة (الماء موصل جيد للكهرباء فيُمنع منعاً باتاً)</td></tr>
<tr><td>D</td><td>معادن: صوديوم، بوتاسيوم، ماغنسيوم</td><td>بودرة جافة خاصة</td></tr>

</table></div>`},
{h:"طرق ومواد الإطفاء", body:`
<p class="lead">لإطفاء أي حريق يجب إزالة أحد عناصر هرم الاشتعال الأربعة، بإحدى الطرق الآتية:</p>
${iconGrid([
 ["fire","#fbeceA","#c8341f","تجويع الحريق","حرمانه من المواد القابلة للاشتعال، بنقل البضائع بعيداً عن الحرارة أو سحب السوائل من الصهاريج."],
 ["health","#eef4f8","#3f6b8a","خنق الحريق","منع وصول الأوكسجين له، بتغطيته بالرغاوى أو استخدام ثاني أكسيد الكربون أو البالون أو البودرة."],
 ["bolt","#eaf5ee","#2f7a4f","تبريد الحريق","تخفيض درجة الحرارة باستخدام المياه — الطريقة الأكثر شيوعاً في الإطفاء."],
 ["gear","#fdf2e3","#c97f00","إيقاف التفاعل المتسلسل","بمواد قادرة على كسر سلسلة التفاعل الكيميائي، كالبودرة والبالون."]
])}
<p class="lead">أنواع طفايات الحريق الأكثر انتشاراً:</p>
<div class="card"><ul>
<li><b>طفايات البودرة الجافة:</b> تحيط الوقود المشتعل بطبقة بودرة تفصله عن الأوكسجين وتوقف التفاعل المتسلسل — من أسرع مواد الإطفاء، وتصلح لأنواع A وB وC (لكن تجنّب استخدامها على الأجهزة الحساسة كالحاسوب لأنها قد تُتلفها).</li>
<li><b>طفايات ثاني أكسيد الكربون:</b> غاز مضغوط يخنق الحريق بإزاحة الأوكسجين، مناسبة جداً للحرائق الكهربائية (النوع C).</li>
<li><b>طفايات البالون (Halon):</b> مادة متبخرة فعالة جداً في إيقاف التفاعل المتسلسل، لكنها ضارة بطبقة الأوزون فتم إيقاف استخدامها تدريجياً لصالح بدائل غير ضارة.</li>
</ul></div>

{h:"قواعد الإطفاء وطريقة الاستعمال (PASS)", body:`
<div class="card"><ul>
<li>كافح الحريق مع اتجاه الريح لا عكسها</li>
<li>ابتعد عن الحريق بمسافة أمان مناسبة (نحو 2 - 3 أمتار) قبل بدء المكافحة</li>
<li>لا تكافح الحريق من منتصفه، بل من الأمام إلى الخلف</li>
<li>حرّك الطفاية يميناً ويساراً أثناء المكافحة</li>
<li>كافح الحريق دائماً من أسفل إلى أعلى</li>
<li>لا تترك مكان الحريق قبل التأكد من إطفائه تماماً</li>
</ul></div>
<p class="lead">تُلخَّص خطوات استخدام طفاية الحريق بالحروف الأولى للكلمة الإنجليزية <b>PASS</b>:</p>
${accItem(1,"Pull — اسحب مسمار الأمان","اسحب مسمار (دبوس) الأمان من مقبض الطفاية لتحريرها للاستخدام.")}
${accItem(2,"Aim — وجّه الخرطوم إلى قاعدة الحريق","لا توجّه الطفاية إلى اللهب العالي، بل إلى قاعدة الاشتعال حيث يوجد الوقود.")}
${accItem(3,"Squeeze — اضغط على يد التشغيل","اضغط بثبات على مقبض التشغيل لتحرير مادة الإطفاء بقوة نحو الحريق.")}
${accItem(4,"Sweep — حرّك الطفاية من جانب لآخر","حرّك اتجاه الرش يميناً ويساراً على قاعدة الحريق حتى الإطفاء الكامل.")}
${photoStrip([
 [DOCIMG.pass_pull, "Pull — اسحب المسمار"],
 [DOCIMG.pass_aim, "Aim — وجّه نحو القاعدة"],
 [DOCIMG.pass_squeeze, "Squeeze — اضغط المقبض"],
 [DOCIMG.pass_sweep, "Sweep — حرّك جانبياً"]
], "الرسوم الأصلية من الحقيبة التدريبية الموضّحة لخطوات طريقة PASS الأربع")}
