{type:"mcq",q:"مادة البالون (Halon) تم تقليص استخدامها بسبب:",opts:["ارتفاع سعرها فقط","تأثيرها الضار على طبقة الأوزون","ضعف فعاليتها في الإطفاء","صعوبة تصنيعها"],a:1},
{type:"tf",q:"يتكون نظام الإنذار الكهربائي (الآلي) من خمسة عناصر رئيسة تشمل وحدة التحكم وكاشفات الحريق.",a:true},
{type:"tf",q:"الكاشفات الدخانية الأيونية تعتمد على مبدأ تغيّر التيار عند دخول جزيئات الدخان لغرفة التأين.",a:true},
{type:"tf",q:"حريق زيت الطبخ (Class K) يُطفأ بالطريقة نفسها المستخدمة لحريق الأخشاب (Class A).",a:false},
{type:"tf",q:"طريقة PASS تنتهي بحرف Sweep، أي تحريك الطفاية من جانب لآخر.",a:true},
{type:"tf",q:"غياب أي عنصر واحد من عناصر هرم الاشتعال الأربعة يكفي لإخماد الحريق.",a:true},
{type:"tf",q:"طفايات البودرة الجافة (ABC) لا تصلح لإطفاء أكثر من نوع واحد من الحرائق.",a:false},
{type:"fill",q:"حريق ناتج عن مواد صلبة عادية كالخشب والورق يُصنَّف من النوع ______.",a:["A"]},
{type:"fill",q:"طريقة الإطفاء التي تعتمد على إزالة الوقود عن الحريق تسمى ______ الحريق.",a:["تجويع"]},
{type:"fill",q:"الحرف الثالث من طريقة PASS يرمز إلى كلمة Squeeze، أي ______ المقبض.",a:["الضغط على","ضغط"]},
{type:"fill",q:"كاشف الحريق الذي يعتمد على اختلاف معامل التمدد الحراري لمعدنين يسمى الثرموستات ذا الصفيحة ______.",a:["المزدوجة"]},
{type:"fill",q:"طفايات البودرة الجافة من نوع ABC تصلح لإطفاء حرائق النوع A، B، و______.",a:["C"]},
{type:"fill",q:"طفايات ثاني ______ الكربون تُستخدم لإخماد حرائق الكهرباء دون ترك أي أثر على المعدات.",a:["أكسيد"]}
]
};

const UNITS = [UNIT1, UNIT2, UNIT3, UNIT4, UNIT5, UNIT6];


</script>
<script>

// ============================================================
// منطق التطبيق: التنقل، عرض الوحدات، محرك الاختبارات، التخزين، التصدير
// ============================================================

let currentPage = "home";
const quizState = {}; // unitId -> {answers:{}, submitted:false}
const slideState = {}; // unitId -> {i: currentSlideIndex}

// ---------- طبقة تخزين مرنة (تعمل داخل بيئة Claude وخارجها على أي استضافة) ----------
// إن كانت واجهة window.storage متوفرة (داخل بيئة Claude) تُستخدم مباشرة.
// وإن لم تكن متوفرة (عند فتح الملف مباشرة أو استضافته على أي موقع خاص)
// يتحول التخزين تلقائياً إلى localStorage الخاص بالمتصفح، بنفس الواجهة (get/set/delete/list)
// حتى يستمر حفظ نتائج الاختبارات وتصديرها في العمل في كل الحالات.
// رابط تطبيق الويب (Google Apps Script) المرتبط بملف Google Sheets
// لتجميع نتائج جميع الطلاب تلقائيًا في مكان واحد
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzupGE-vwN0V-BGZ2l3y-4w0oQW8hpCBxp8MzwE9IgHLj5TwSgzbunDAEls5RhINmPD/exec";

function sendToSheet(record){
  if(!SHEET_WEBHOOK_URL) return;
  try{
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors', // تطبيقات Google Apps Script لا تدعم CORS القياسي، ولا نحتاج قراءة الرد
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        name: record.name,
        studentId: record.studentId,
        unit: record.unitTitle,
        score: `${record.score}/${record.total}`,
        percentage: record.pct
      })
    });
  }catch(e){ console.error("sheet webhook error", e); }
}

const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && !!window.storage);
const Store = HAS_CLAUDE_STORAGE ? window.storage : {
  async set(key, value){
    localStorage.setItem('sq_'+key, value); return {key, value};
  },
  async get(key){
    const v = localStorage.getItem('sq_'+key);
    if(v === null) throw new Error('not found');
    return {key, value:v};
  },
  async delete(key){
    localStorage.removeItem('sq_'+key); return {key, deleted:true};
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('sq_'+(prefix||''))) keys.push(k.slice(3));
    }
    return {keys};
  }
};

// ---------- حماية صفحة النتائج (رمز دخول للمشرف) ----------
// يمكن للمدرّب تغيير هذا الرمز قبل توزيع الملف على المتدربين.
// ملاحظة: هذه حماية بسيطة على مستوى المتصفح لردع الوصول العرضي فقط،
// وليست حماية أمنية حقيقية (الملف بأكمله يعمل محلياً بدون خادم).
const ADMIN_ACCESS_CODE = "1234";
let resultsUnlocked = false;

// ---------- تنقّل أعلى الصفحة (بديل القائمة الجانبية) ----------
// لا حاجة لبناء قائمة تنقّل جانبية بعد الآن؛ الانتقال بين الوحدات
// يتم من بطاقات الصفحة الرئيسية وأزرار "الوحدة التالية/السابقة".

// ---------- بناء صفحة الرئيسية ----------
function renderHome(){
  const cardsHtml = UNITS.map(u=>`
    <a href="#" class="unit-card" onclick="goTo('${u.id}');return false;">
      <div class="uc-top">
        <div class="uc-icon" style="background:${u.color}22;color:${u.color}">${ICONS[u.icon]}</div>
        <div class="uc-num">الوحدة ${arabicOrdinal(u.num)}</div>
      </div>
      <div class="uc-title">${u.title}</div>
      <div class="uc-desc">${u.short}</div>
      <div class="uc-foot">
        <span class="uc-badge" id="home-badge-${u.id}">${u.sections.length} شرائح</span>
        <span style="color:var(--muted)">ابدأ ←</span>
      </div>
    </a>`).join('');

  return `
  <div class="hero">
    <div class="hero-inner">
      <span class="hero-eyebrow">${ICONS.shield} حقيبة تدريبية رسمية</span>
      <h1>السلامة الصناعية لتخصصات الآلات والمعدات الكهربائية</h1>
      <p>وحدات تدريبية تفاعلية إثرائية — المطلوب منك تصفح وقراءة كل وحدة، وحل الأسئلة الموجودة في نهايتها، ولا تنسى تسجيل اسمك ورقمك الأكاديمي ليتسنى رصد درجة الواجب والمشاركة لك.</p>
      <div class="hero-stats">
        <div class="hstat"><b>6</b><span>وحدات تدريبية</span></div>
        <div class="hstat"><b>${UNITS.reduce((s,u)=>s+u.quiz.length,0)}</b><span>سؤال اختباري</span></div>
        <div class="hstat"><b id="home-done-count">0</b><span>وحدة أنجزتَها</span></div>
      </div>
    </div>
  </div>
  <div class="unit-grid">${cardsHtml}</div>`;
}

function arabicOrdinal(n){
  const words = ["", "الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة"];
  return words[n]||n;
}

// ---------- بناء صفحة وحدة (عرض شرائح) ----------
function renderUnit(u, idx){
  const prevUnit = UNITS[idx-1];
  const nextUnit = UNITS[idx+1];
  const total = u.sections.length;
  const st = slideState[u.id] = slideState[u.id] || {i:0};
  const cur = Math.max(0, Math.min(st.i, total-1));
  const sec = u.sections[cur];
  const isFirst = cur===0, isLast = cur===total-1;

  const dots = u.sections.map((s,i)=>
    `<button class="slide-dot${i===cur?' active':''}" title="${s.h}" aria-label="${s.h}" onclick="goSlide('${u.id}',${i})"></button>`
  ).join('');

  const prevBtn = isFirst
    ? `<span></span>`
    : `<button class="btn ghost" onclick="goSlide('${u.id}',${cur-1})">${ICONS.chevron.replace('class="chev"','style="transform:rotate(90deg)"')} الشريحة السابقة</button>`;

  const nextBtn = isLast
    ? `<button class="btn primary" onclick="goTo('${u.id}-quiz')">ابدأ اختبار الوحدة ${ICONS.chevron.replace('class="chev"','style="transform:rotate(-90deg)"')}</button>`
    : `<button class="btn primary" onclick="goSlide('${u.id}',${cur+1})">الشريحة التالية ${ICONS.chevron.replace('class="chev"','style="transform:rotate(-90deg)"')}</button>`;

  const navHtml = `<div class="unit-nav">
    ${prevUnit ? `<a href="#" onclick="goTo('${prevUnit.id}');return false;"><span>${ICONS.chevron.replace('class="chev"','style="transform:rotate(90deg)"')}</span><div><span class="lbl">الوحدة السابقة</span><b>${prevUnit.title}</b></div></a>` : `<div></div>`}
    ${nextUnit ? `<a href="#" class="next" onclick="goTo('${nextUnit.id}');return false;"><div><span class="lbl">الوحدة التالية</span><b>${nextUnit.title}</b></div><span>${ICONS.chevron.replace('class="chev"','style="transform:rotate(-90deg)"')}</span></a>` : `<a href="#" class="next" onclick="goTo('results');return false;"><div><span class="lbl">أنهيت كل الوحدات</span><b>عرض سجل النتائج</b></div></a>`}
  </div>`;

  return `
  <div class="unit-head">
    <div class="unit-head-inner">
      <div class="uh-crumb"><button onclick="goTo('home')">الرئيسية</button> / الوحدة ${arabicOrdinal(u.num)}</div>
      <div class="uh-top">
        <div class="uh-icon">${ICONS[u.icon]}</div>
        <div><div class="uh-kicker">الوحدة ${arabicOrdinal(u.num)}</div><h1 class="uh-title">${u.title}</h1></div>
      </div>
      <div class="uh-goal">
        <b>الهدف العام للوحدة</b>${u.goal}
        <div class="uh-obj">${u.objectives.map(o=>`<span class="obj-chip">${o}</span>`).join('')}</div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="slide-deck">
      <div class="slide-topbar">
        <div class="slide-dots">${dots}</div>
        <div class="slide-counter">شريحة ${cur+1} من ${total}</div>
      </div>
      <div class="slide-card" id="slidecard-${u.id}">
        <h2>${sec.h}</h2>
        ${sec.body}
      </div>
      <div class="slide-nav">${prevBtn}${nextBtn}</div>
    </div>
    ${navHtml}
  </div>`;
}

// تبديل الشريحة الحالية داخل وحدة معيّنة
function goSlide(uid, i){
  slideState[uid] = slideState[uid] || {i:0};
  slideState[uid].i = i;
  const idx = UNITS.findIndex(u=>u.id===uid);
  if(idx>-1){
    ensurePageDiv(uid, renderUnit(UNITS[idx], idx));
    const card = document.getElementById('slidecard-'+uid);
    if(card && typeof card.scrollIntoView === 'function') card.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

// ---------- بناء صفحة اختبار مستقلة ----------
function renderQuizPage(u, idx){
  const prevUnit = UNITS[idx-1];
  const nextUnit = UNITS[idx+1];
  return `
  <div class="unit-head" style="background:var(--navy)">
    <div class="unit-head-inner">
      <div class="uh-crumb">
        <button onclick="goTo('home')">الرئيسية</button> /
        <button onclick="goTo('${u.id}')">${u.title}</button> / الاختبار
      </div>
      <div class="uh-top">
        <div class="uh-icon">${ICONS.book}</div>
        <div><div class="uh-kicker">اختبار الوحدة ${arabicOrdinal(u.num)}</div><h1 class="uh-title">${u.title}</h1></div>
      </div>
    </div>
  </div>
  <div class="wrap">
    ${renderQuiz(u)}
    <div class="unit-nav">
      <a href="#" onclick="goTo('${u.id}');return false;"><span>${ICONS.chevron.replace('class="chev"','style="transform:rotate(90deg)"')}</span><div><span class="lbl">العودة إلى</span><b>محتوى الوحدة</b></div></a>
      ${nextUnit
        ? `<a href="#" class="next" onclick="goTo('${nextUnit.id}');return false;"><div><span class="lbl">تابع إلى</span><b>${nextUnit.title}</b></div><span>${ICONS.chevron.replace('class="chev"','style="transform:rotate(-90deg)"')}</span></a>`
        : `<a href="#" class="next" onclick="goTo('results');return false;"><div><span class="lbl">أنهيت كل الوحدات</span><b>عرض سجل النتائج</b></div></a>`}
    </div>
  </div>`;
}

// ---------- محرك الاختبار ----------
function renderQuiz(u){
  quizState[u.id] = quizState[u.id] || {answers:{}, submitted:false, result:null};
  const qHtml = u.quiz.map((q,i)=>{
    const typeLabel = q.type==='tf' ? 'صواب / خطأ' : q.type==='fill' ? 'أكمل الفراغ' : 'اختيار من متعدد';
    let bodyHtml = '';
    if(q.type==='tf'){
      bodyHtml = `
      <div class="opt-list">
        <label class="opt" id="opt-${u.id}-${i}-1"><input type="radio" name="q-${u.id}-${i}" value="1" onchange="pickAnswer('${u.id}',${i},true)"><span>✓ صحيح</span></label>
        <label class="opt" id="opt-${u.id}-${i}-0"><input type="radio" name="q-${u.id}-${i}" value="0" onchange="pickAnswer('${u.id}',${i},false)"><span>✗ خطأ</span></label>
      </div>`;
    } else if(q.type==='fill'){
      bodyHtml = `
      <div class="fill-wrap">
        <input type="text" class="fill-input" id="fill-${u.id}-${i}" placeholder="اكتب الإجابة هنا..." oninput="typeAnswer('${u.id}',${i},this.value)">
      </div>`;
    } else {
      bodyHtml = `
      <div class="opt-list">
        ${q.opts.map((op,oi)=>`
          <label class="opt" id="opt-${u.id}-${i}-${oi}">
            <input type="radio" name="q-${u.id}-${i}" value="${oi}" onchange="pickAnswer('${u.id}',${i},${oi})">
            <span>${op}</span>
          </label>`).join('')}
      </div>`;
    }
    return `
    <div class="q-block">
      <div class="q-num">السؤال ${i+1} من ${u.quiz.length} <span class="q-type-tag">${typeLabel}</span></div>
      <div class="q-text">${q.q}</div>
      ${bodyHtml}
    </div>`;
  }).join('');

  return `
  <div class="quiz-wrap" id="quiz-${u.id}">
    <div class="quiz-head"><div class="ic">${ICONS.book}</div><h2>اختبار الوحدة ${arabicOrdinal(u.num)}</h2></div>
    <p class="quiz-sub">أدخل اسمك ورقمك الأكاديمي، ثم أجب عن جميع الأسئلة (اختيار من متعدد، صواب وخطأ، وإكمال الفراغ). تُحفظ نتيجتك تلقائياً بعد الإرسال، ويمكن تصديرها إلى إكسل من صفحة سجل النتائج.</p>

    <div id="quiz-form-${u.id}">
      <div class="stu-form">
        <div class="stu-field"><label>الاسم الكامل</label><input type="text" id="name-${u.id}" placeholder="مثال: محمد عبدالله العتيبي"></div>
        <div class="stu-field"><label>الرقم الأكاديمي</label><input type="text" id="sid-${u.id}" placeholder="مثال: 4410123456"></div>
      </div>
      ${qHtml}
      <div class="quiz-actions">
        <button class="btn primary" onclick="submitQuiz('${u.id}')">إرسال الإجابات وعرض النتيجة</button>
        <span class="quiz-msg" id="msg-${u.id}"></span>
      </div>
    </div>

    <div class="result-box" id="result-${u.id}">
      <div class="result-ring" id="ring-${u.id}"><b id="ringtxt-${u.id}"></b></div>
      <div class="result-name" id="resname-${u.id}"></div>
      <div class="result-sub" id="ressub-${u.id}"></div>
      <div id="review-${u.id}" class="review-wrap"></div>
      <div class="quiz-actions" style="justify-content:center">
        <button class="btn dark" onclick="downloadMyResult('${u.id}')">${ICONS.download} تنزيل نتيجتي (Excel)</button>
      </div>
    </div>
  </div>`;
}

// تطبيع النص العربي لتصحيح إجابات إكمال الفراغ بمرونة
// (يتجاهل التشكيل، ويوحّد صور الألف والياء والتاء المربوطة، ويتجاهل المسافات الزائدة)
function normalizeArabic(s){
  return (s||'').toString().trim()
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/\s+/g,' ')
    .toLowerCase();
}

function isFillCorrect(q, val){
  const norm = normalizeArabic(val);
  if(!norm) return false;
  return q.a.some(acc => normalizeArabic(acc) === norm);
}

function pickAnswer(uid, qi, val){
  quizState[uid].answers[qi] = val;
  document.querySelectorAll(`[id^="opt-${uid}-${qi}-"]`).forEach(el=>el.classList.remove('picked'));
  const oi = (typeof val === 'boolean') ? (val ? 1 : 0) : val;
  const el = document.getElementById(`opt-${uid}-${qi}-${oi}`);
  if(el) el.classList.add('picked');
}

function typeAnswer(uid, qi, val){
  quizState[uid].answers[qi] = val;
}

function isAnswered(uid, qi){
  const v = quizState[uid].answers[qi];
  if(v === undefined || v === null) return false;
  if(typeof v === 'string' && v.trim()==='') return false;
  return true;
}

async function submitQuiz(uid){
  const u = UNITS.find(x=>x.id===uid);
  const name = document.getElementById(`name-${uid}`).value.trim();
  const sid = document.getElementById(`sid-${uid}`).value.trim();
  const msg = document.getElementById(`msg-${uid}`);

  if(!name || !sid){ msg.textContent = "يرجى إدخال الاسم والرقم الأكاديمي قبل الإرسال."; return; }
  const st = quizState[uid];
  const answeredCount = u.quiz.filter((q,i)=>isAnswered(uid,i)).length;
  if(answeredCount < u.quiz.length){
    msg.textContent = `يرجى الإجابة عن جميع الأسئلة (${answeredCount}/${u.quiz.length} مكتملة).`;
    return;
  }
  msg.textContent = "";

  let score = 0;
  const reviewRows = [];
  u.quiz.forEach((q,i)=>{
    const given = st.answers[i];
    let correct = false;
    let givenText = '', correctText = '';
    if(q.type==='tf'){
      correct = (given === q.a);
      givenText = given ? 'صحيح' : 'خطأ';
      correctText = q.a ? 'صحيح' : 'خطأ';
    } else if(q.type==='fill'){
      correct = isFillCorrect(q, given);
      givenText = given || '—';
      correctText = q.a[0];
    } else {
      correct = (given === q.a);
      givenText = q.opts[given] ?? '—';
      correctText = q.opts[q.a];
    }
    if(correct) score++;
    reviewRows.push({i, q:q.q, correct, givenText, correctText});
  });
  const total = u.quiz.length;
  const pct = Math.round((score/total)*100);

  const record = {
    name, studentId: sid, unitId: uid, unitTitle: u.title,
    score, total, pct, date: new Date().toISOString()
  };
  st.submitted = true; st.result = record; st.review = reviewRows;

  // حفظ في التخزين المشترك (يظهر لجميع من يستخدم هذا الموقع، لتمكين التصدير الجماعي)
  try{
    const key = `result:${uid}:${sid}:${Date.now()}`;
    await Store.set(key, JSON.stringify(record), true);
  }catch(e){ console.error("storage error", e); }

  // إرسال نسخة تلقائية إلى ملف Google Sheets المركزي
  sendToSheet(record);

  showResult(uid, record);
  refreshProgressBadges();
}

function renderReview(uid){
  const st = quizState[uid];
  const el = document.getElementById(`review-${uid}`);
  if(!el || !st.review) return;
  el.innerHTML = `<div class="review-title">مراجعة الإجابات</div>` + st.review.map(r=>`
    <div class="review-row ${r.correct?'ok':'bad'}">
      <div class="rr-icon">${r.correct?'✓':'✗'}</div>
      <div class="rr-body">
        <div class="rr-q">${r.i+1}. ${r.q}</div>
        ${r.correct
          ? `<div class="rr-ans">إجابتك: ${r.givenText}</div>`
          : `<div class="rr-ans">إجابتك: ${r.givenText} — الصحيح: <b>${r.correctText}</b></div>`}
      </div>
    </div>`).join('');
}

function showResult(uid, record){
  document.getElementById(`quiz-form-${uid}`).style.display = 'none';
  const box = document.getElementById(`result-${uid}`);
  box.classList.add('show');
  document.getElementById(`ring-${uid}`).style.setProperty('--pct', record.pct);
  document.getElementById(`ringtxt-${uid}`).textContent = record.pct + '%';
  document.getElementById(`resname-${uid}`).textContent = record.name;
  document.getElementById(`ressub-${uid}`).textContent =
    `الرقم الأكاديمي ${record.studentId} — ${record.score} من ${record.total} إجابات صحيحة`;
  renderReview(uid);
}

// تنزيل نتيجة فردية بصيغة إكسل
function downloadMyResult(uid){
  const st = quizState[uid];
  if(!st || !st.result) return;
  const r = st.result;
  const rows = [{
    "الاسم": r.name, "الرقم الأكاديمي": r.studentId, "الوحدة": r.unitTitle,
    "الدرجة": r.score, "من": r.total, "النسبة %": r.pct,
    "التاريخ": new Date(r.date).toLocaleString('ar-SA')
  }];
  exportRowsToExcel(rows, `نتيجة_${r.studentId}_${uid}`);
}

function refreshProgressBadges(){
  UNITS.forEach(u=>{
    const st = quizState[u.id];
    const el = document.getElementById(`prog-${u.id}`);
    if(el) el.textContent = st && st.submitted ? '✓' : '';
    const badge = document.getElementById(`home-badge-${u.id}`);
    if(badge && st && st.submitted){
      badge.textContent = `أُنجزت — ${st.result.pct}%`;
      badge.classList.add('done');
    }
  });
  const doneCount = UNITS.filter(u=>quizState[u.id] && quizState[u.id].submitted).length;
  const dc = document.getElementById('home-done-count');
  if(dc) dc.textContent = doneCount;
}

// ---------- صفحة سجل النتائج والتصدير (محمية برمز دخول) ----------
function renderResultsLock(){
  const wrap = `
  <div class="unit-head" style="background:var(--navy)">
    <div class="unit-head-inner">
      <div class="uh-crumb"><button onclick="goTo('home')">الرئيسية</button> / سجل النتائج</div>
      <div class="uh-top">
        <div class="uh-icon">${ICONS.chart}</div>
        <div><div class="uh-kicker">صفحة خاصة بمشرف النظام</div><h1 class="uh-title">سجل نتائج المتدربين</h1></div>
      </div>
      <div class="uh-goal">هذه الصفحة مخصصة لمشرف النظام / المدرّب فقط. أدخل رمز الدخول للمتابعة.</div>
    </div>
  </div>
  <div class="wrap" style="max-width:460px">
    <div class="card" style="padding:28px 26px;text-align:center">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--paper2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--muted)">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h3 style="margin-bottom:6px">دخول مقيَّد</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:18px">يرجى إدخال رمز دخول المشرف لعرض نتائج المتدربين وتصديرها.</p>
      <input type="password" id="admin-code-input" placeholder="رمز الدخول" style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;text-align:center;letter-spacing:2px;margin-bottom:12px" onkeydown="if(event.key==='Enter')checkAdminCode()">
      <button class="btn primary" style="width:100%" onclick="checkAdminCode()">دخول</button>
      <div id="admin-code-msg" style="color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px"></div>
    </div>
  </div>`;
  document.getElementById('pages').innerHTML += `<div class="page" id="page-results">${wrap}</div>`;
  setTimeout(()=>{ const el = document.getElementById('admin-code-input'); if(el) el.focus(); }, 50);
}

function checkAdminCode(){
  const input = document.getElementById('admin-code-input');
  const msg = document.getElementById('admin-code-msg');
  if(input.value === ADMIN_ACCESS_CODE){
    resultsUnlocked = true;
    const existing = document.getElementById('page-results');
    if(existing) existing.remove();
    renderResults();
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-results'));
  } else {
    msg.textContent = "رمز الدخول غير صحيح. حاول مرة أخرى.";
    input.value = "";
    input.focus();
  }
}

function lockResultsPage(){
  resultsUnlocked = false;
  const existing = document.getElementById('page-results');
  if(existing) existing.remove();
  renderResultsLock();
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-results'));
}

async function renderResults(){
  const wrap = `
  <div class="unit-head" style="background:var(--navy)">
    <div class="unit-head-inner">
      <div class="uh-crumb"><button onclick="goTo('home')">الرئيسية</button> / سجل النتائج</div>
      <div class="uh-top">
        <div class="uh-icon">${ICONS.chart}</div>
        <div><div class="uh-kicker">للمدرب / مسؤول التدريب</div><h1 class="uh-title">سجل نتائج المتدربين</h1></div>
      </div>
      <div class="uh-goal">تُجمع هنا نتائج جميع المتدربين الذين أدّوا اختبارات هذا الموقع (تُخزَّن بشكل مشترك ليتمكن المُدرِّب من تصديرها). اضغط «تحديث القائمة» بعد أن يُنهي المتدربون اختباراتهم.</div>
    </div>
  </div>
  <div class="wrap">
    <div class="stat-row" id="stat-row"></div>
    <div class="admin-toolbar">
      <input type="text" id="search-results" placeholder="ابحث بالاسم أو الرقم الأكاديمي..." oninput="filterResultsTable()">
      <button class="btn dark" onclick="loadResultsTable()">${ICONS.gear} تحديث القائمة</button>
      <button class="btn primary" onclick="exportAllResults()">${ICONS.download} تصدير الكل إلى Excel</button>
      <button class="btn ghost" onclick="lockResultsPage()" style="background:transparent;border:1px solid var(--line);color:var(--muted)">إغلاق الصفحة</button>
    </div>
    <div class="tbl-wrap"><table id="results-table">
      <tr><th>الاسم</th><th>الرقم الأكاديمي</th><th>الوحدة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>
    </table></div>
  </div>`;
  document.getElementById('pages').innerHTML += `<div class="page" id="page-results">${wrap}</div>`;
  await loadResultsTable();
}

let allResultsCache = [];
async function loadResultsTable(){
  const tbl = document.getElementById('results-table');
  try{
    const list = await Store.list('result:', true);
    const keys = (list && list.keys) || [];
    const rows = [];
    for(const k of keys){
      try{
        const res = await Store.get(k, true);
        if(res && res.value) rows.push(JSON.parse(res.value));
      }catch(e){}
    }
    rows.sort((a,b)=> new Date(b.date) - new Date(a.date));
    allResultsCache = rows;
    renderResultsTable(rows);
    renderStatRow(rows);
  }catch(e){
    console.error(e);
    tbl.innerHTML = `<tr><th>الاسم</th><th>الرقم الأكاديمي</th><th>الوحدة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>
    <tr><td colspan="6" style="text-align:center;color:var(--muted)">تعذّر تحميل النتائج. حاول الضغط على «تحديث القائمة» مرة أخرى.</td></tr>`;
  }
}

function renderStatRow(rows){
  const el = document.getElementById('stat-row');
  const studentSet = new Set(rows.map(r=>r.studentId));
  const avg = rows.length ? Math.round(rows.reduce((s,r)=>s+r.pct,0)/rows.length) : 0;
  const passCount = rows.filter(r=>r.pct>=60).length;
  el.innerHTML = `
    <div class="stat-card"><b>${rows.length}</b><span>محاولة اختبار مسجّلة</span></div>
    <div class="stat-card"><b>${studentSet.size}</b><span>متدرب مختلف</span></div>
    <div class="stat-card"><b>${avg}%</b><span>متوسط النسب</span></div>
    <div class="stat-card"><b>${passCount}</b><span>محاولات ناجحة (٦٠٪+)</span></div>`;
}

function renderResultsTable(rows){
  const tbl = document.getElementById('results-table');
  if(!rows.length){
    tbl.innerHTML = `<tr><th>الاسم</th><th>الرقم الأكاديمي</th><th>الوحدة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>
    <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:26px">لا توجد نتائج محفوظة بعد — بعد أن يُنهي المتدربون اختباراتهم، اضغط «تحديث القائمة».</td></tr>`;
    return;
  }
  tbl.innerHTML = `<tr><th>الاسم</th><th>الرقم الأكاديمي</th><th>الوحدة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>` +
    rows.map(r=>`<tr>
      <td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.studentId)}</td><td>${escapeHtml(r.unitTitle)}</td>
      <td>${r.score} / ${r.total}</td><td>${r.pct}%</td><td>${new Date(r.date).toLocaleString('ar-SA')}</td>
    </tr>`).join('');
}

function filterResultsTable(){
  const q = document.getElementById('search-results').value.trim().toLowerCase();
  if(!q){ renderResultsTable(allResultsCache); return; }
  const filtered = allResultsCache.filter(r =>
    (r.name||'').toLowerCase().includes(q) || (r.studentId||'').toLowerCase().includes(q));
  renderResultsTable(filtered);
}

function exportAllResults(){
  if(!allResultsCache.length){ alert('لا توجد نتائج لتصديرها حالياً.'); return; }
  const rows = allResultsCache.map(r=>({
    "الاسم": r.name, "الرقم الأكاديمي": r.studentId, "الوحدة": r.unitTitle,
    "الدرجة": r.score, "من": r.total, "النسبة %": r.pct,
    "التاريخ": new Date(r.date).toLocaleString('ar-SA')
  }));
  exportRowsToExcel(rows, "نتائج_السلامة_الصناعية");
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- تصدير إلى إكسل (SheetJS) ----------
function exportRowsToExcel(rows, filenameBase){
  if(typeof XLSX === 'undefined'){
    alert('تعذّر تحميل مكتبة إكسل (XLSX). هذه الميزة تحتاج اتصالاً بالإنترنت لتحميلها من الشبكة — تأكد من اتصالك وحاول مرة أخرى.');
    return;
  }
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "النتائج");
    // نستخدم base64 مباشرة (بدل Blob/createObjectURL) لأنها أكثر ثباتاً
    // داخل نوافذ المعاينة المحمية التي قد تحجب روابط blob: الصامتة
    const b64 = XLSX.write(wb, {bookType:'xlsx', type:'base64'});
    const dataUrl = `data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${b64}`;
    const filename = `${filenameBase}.xlsx`;

    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // رابط بديل ثابت (لا يختفي تلقائياً) في حال لم يبدأ التنزيل الفوري بنفسه —
    // مهم خصوصاً داخل نوافذ معاينة محمية قد تحجب النقر البرمجي بصمت
    showManualDownloadFallback(dataUrl, filename);
  }catch(e){
    console.error(e);
    alert('حدث خطأ أثناء إنشاء ملف إكسل. جرّب فتح هذا الملف في متصفح مباشرةً (خارج نافذة المعاينة) إن استمرت المشكلة.');
  }
}

// شريط ثابت (لا يختفي تلقائياً) يظهر بعد كل عملية تصدير، فيه رابط يدوي مباشر للملف
// كبديل مضمون في حال لم يبدأ التنزيل التلقائي (مثلاً داخل معاينة محمية)
function showManualDownloadFallback(url, filename){
  let bar = document.getElementById('dl-fallback-bar');
  if(bar) bar.remove();
  bar = document.createElement('div');
  bar.id = 'dl-fallback-bar';
  bar.className = 'dl-fallback-bar';
  bar.innerHTML = `
    <span>إذا لم يبدأ التنزيل تلقائياً، اضغط هنا:</span>
    <a href="${url}" download="${filename}" target="_blank" rel="noopener">تنزيل ${filename}</a>
    <button onclick="this.parentElement.remove()" aria-label="إغلاق">✕</button>`;
  document.body.appendChild(bar);
}

// ---------- تبويبات (Tabs) ----------
function switchTab(groupId, idx, btn){
  const group = document.querySelector(`[data-tabgroup="${groupId}"]`);
  group.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll(`[data-tab^="${groupId}-"]`).forEach(p=>p.classList.remove('active'));
  document.querySelector(`[data-tab="${groupId}-${idx}"]`).classList.add('active');
}

// ---------- التنقل بين الصفحات ----------
function goTo(page, force){
  if(page===currentPage && !force){ scrollToTop(); return; }
  currentPage = page;
  renderPage(page);
  scrollToTop();
}

function scrollToTop(){ window.scrollTo({top:0, behavior:'instant'}); }

function renderPage(page){
  const pages = document.getElementById('pages');
  if(page==='home'){
    ensurePageDiv('home', renderHome());
  } else if(page==='results'){
    if(!document.getElementById('page-results')){
      if(resultsUnlocked){ renderResults(); } else { renderResultsLock(); }
    }
  } else if(page.endsWith('-quiz')){
    const uid = page.slice(0, -5);
    const idx = UNITS.findIndex(u=>u.id===uid);
    if(idx>-1){
      // Rebuild quiz page fresh each time to reset form DOM binding cleanly on retake
      const existing = document.getElementById('page-'+page);
      if(existing) existing.remove();
      ensurePageDiv(page, renderQuizPage(UNITS[idx], idx));
      // إن كان المتدرب قد أنهى هذا الاختبار سابقاً في هذه الجلسة، أظهر نتيجته مباشرة
      const st = quizState[uid];
      if(st && st.submitted && st.result){ showResult(uid, st.result); }
    }
  } else {
    const idx = UNITS.findIndex(u=>u.id===page);
    if(idx>-1){
      if(!document.getElementById('page-'+page)){
        ensurePageDiv(page, renderUnit(UNITS[idx], idx));
      }
    }
  }
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id === 'page-'+page));
  refreshProgressBadges();
}

function ensurePageDiv(id, html){
  let el = document.getElementById('page-'+id);
  if(!el){
    el = document.createElement('div');
    el.className = 'page';
    el.id = 'page-'+id;
    document.getElementById('pages').appendChild(el);
  }
  el.innerHTML = html;
}

// ---------- التهيئة ----------
document.addEventListener('DOMContentLoaded', ()=>{
  goTo('home', true);
});


</script>
